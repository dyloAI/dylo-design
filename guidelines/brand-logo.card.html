<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body{ margin:0; font-family:var(--font-display, 'Space Grotesk', system-ui, sans-serif); }
  .grid{ display:grid; grid-template-columns:1fr 1fr; }
  .cell{ display:flex; align-items:center; justify-content:center; gap:18px; padding:34px; }
  .cell.a{ background:var(--surface-card, #F6F3EC); border-right:1px solid var(--hairline, #D8CFBC); }
  .cell.b{ background:var(--dylo-ink, #1B1714); }
  .wm{ font-size:64px; font-weight:700; letter-spacing:-0.05em; line-height:0.8; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell a">
      <svg viewBox="0 0 64 56" width="64" aria-hidden="true"><path d="M10.5,18 L22.5,12.6 L27,48 L15.5,43.5 Z" fill="#1B1714"/><path d="M53.5,18 L41.5,12.6 L37,48 L48.5,43.5 Z" fill="#1B1714"/><path d="M24,12 L40,12 L35.5,48 L28.5,48 Z" fill="#9A5236"/></svg>
      <span class="wm" style="color:var(--dylo-ink, #1B1714);">dylo</span>
    </div>
    <div class="cell b">
      <svg viewBox="0 0 64 56" width="64" aria-hidden="true"><path d="M10.5,18 L22.5,12.6 L27,48 L15.5,43.5 Z" fill="#ECE6D8"/><path d="M53.5,18 L41.5,12.6 L37,48 L48.5,43.5 Z" fill="#ECE6D8"/><path d="M24,12 L40,12 L35.5,48 L28.5,48 Z" fill="#9A5236"/></svg>
      <span class="wm" style="color:var(--dylo-bone, #ECE6D8);">dylo</span>
    </div>
  </div>
</body>
</html>
