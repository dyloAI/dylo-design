<!-- @dsCard group="Type" viewport="700x200" subtitle="Space Mono — the technical layer" name="Space Mono" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body{ margin:0; background:var(--dylo-ink, #1B1714); color:var(--dylo-bone, #ECE6D8); font-family:var(--font-mono, 'Space Mono', ui-monospace, monospace); }
  .wrap{ padding:22px 24px; }
  .lab{ font-size:13px; letter-spacing:0.24em; color:#A79D8E; }
  .big{ font-size:56px; font-weight:700; letter-spacing:-0.02em; line-height:1; margin-top:10px; }
  .meta{ font-size:12px; letter-spacing:0.1em; color:#A79D8E; margin-top:14px; }
  .set{ font-size:18px; color:#C7BEB1; margin-top:10px; }
  .tick{ display:inline-block; width:10px; height:10px; background:var(--accent, #9A5236); margin-right:9px; vertical-align:middle; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lab"><span class="tick"></span>TECHNICAL LABEL · 0123</div>
    <div class="big">dylo 0123</div>
    <div class="meta">SPACE MONO · EYEBROWS / LABELS / DATA · REGULAR + BOLD</div>
    <div class="set">ABCDEFGHIJKLM abcdefghijklm 0123456789</div>
  </div>
</body>
</html>
