<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body{ margin:0; background:var(--surface-card, #F6F3EC); color:var(--text-strong, #1B1714); font-family:var(--font-display, 'Space Grotesk', system-ui, sans-serif); }
  .wrap{ padding:16px 24px; }
  .r{ display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--hairline, #D8CFBC); padding:9px 0; }
  .r:last-child{ border-bottom:none; }
  .spec{ font-family:var(--font-mono, 'Space Mono', ui-monospace, monospace); font-size:11px; color:var(--text-muted, #8E857A); letter-spacing:0.04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="r"><span style="font-size:34px; font-weight:700; letter-spacing:-0.03em;">Display</span><span class="spec">Grotesk · 80 / 700 / -0.03em</span></div>
    <div class="r"><span style="font-size:27px; font-weight:700; letter-spacing:-0.02em;">Headline</span><span class="spec">Grotesk · 48 / 700</span></div>
    <div class="r"><span style="font-size:21px; font-weight:600;">Subhead</span><span class="spec">Grotesk · 28 / 600</span></div>
    <div class="r"><span style="font-size:16px; font-weight:400;">Body copy — measured, plain.</span><span class="spec">Grotesk · 16 / 400 / 1.6</span></div>
    <div class="r"><span style="font-family:var(--font-mono, 'Space Mono', ui-monospace, monospace); font-size:12px; letter-spacing:0.14em;">EYEBROW · LABEL</span><span class="spec">Mono · 12 / 400 / 0.14em</span></div>
  </div>
</body>
</html>
