<!-- @dsCard group="Type" viewport="700x200" subtitle="Space Grotesk — display, headline, body, UI" name="Space Grotesk" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body{ margin:0; background:var(--surface-card, #F6F3EC); font-family:var(--font-display, 'Space Grotesk', system-ui, sans-serif); color:var(--text-strong, #1B1714); }
  .wrap{ padding:22px 24px; }
  .big{ font-size:82px; font-weight:700; letter-spacing:-0.03em; line-height:0.9; }
  .meta{ font-family:var(--font-mono, 'Space Mono', ui-monospace, monospace); font-size:12px; letter-spacing:0.1em; color:var(--text-muted, #8E857A); margin-top:8px; }
  .set{ font-size:22px; font-weight:400; color:var(--text-body, #3A352F); margin-top:14px; letter-spacing:0.01em; }
  .wts{ display:flex; gap:22px; margin-top:14px; }
  .wts span{ font-size:17px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="big">Software, made.</div>
    <div class="meta">SPACE GROTESK · DISPLAY / HEADLINE / BODY / UI</div>
    <div class="wts">
      <span style="font-weight:400;">Regular</span>
      <span style="font-weight:500;">Medium</span>
      <span style="font-weight:600;">SemiBold</span>
      <span style="font-weight:700;">Bold</span>
    </div>
    <div class="set">ABCDEFGHIJKLM abcdefghijklm 0123456789</div>
  </div>
</body>
</html>
