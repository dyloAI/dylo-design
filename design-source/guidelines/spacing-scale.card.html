<!-- @dsCard group="Spacing" viewport="700x160" subtitle="4px base scale" name="Spacing scale" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body{ margin:0; background:var(--surface-card, #F6F3EC); font-family:var(--font-mono, 'Space Mono', ui-monospace, monospace); }
  .wrap{ padding:20px 24px; display:flex; align-items:flex-end; gap:16px; }
  .s{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar{ background:var(--dylo-ink, #1B1714); width:26px; }
  .lb{ font-size:11px; color:var(--text-muted, #8E857A); }
  .vl{ font-size:11px; color:var(--text-strong, #1B1714); font-weight:700; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="s"><div class="bar" style="height:4px;  background:var(--accent, #9A5236);"></div><div class="vl">4</div><div class="lb">1</div></div>
    <div class="s"><div class="bar" style="height:8px;"></div><div class="vl">8</div><div class="lb">2</div></div>
    <div class="s"><div class="bar" style="height:12px;"></div><div class="vl">12</div><div class="lb">3</div></div>
    <div class="s"><div class="bar" style="height:16px;"></div><div class="vl">16</div><div class="lb">4</div></div>
    <div class="s"><div class="bar" style="height:24px;"></div><div class="vl">24</div><div class="lb">5</div></div>
    <div class="s"><div class="bar" style="height:32px;"></div><div class="vl">32</div><div class="lb">6</div></div>
    <div class="s"><div class="bar" style="height:48px;"></div><div class="vl">48</div><div class="lb">7</div></div>
    <div class="s"><div class="bar" style="height:64px;"></div><div class="vl">64</div><div class="lb">8</div></div>
    <div class="s"><div class="bar" style="height:88px;"></div><div class="vl">96</div><div class="lb">9</div></div>
  </div>
</body>
</html>
