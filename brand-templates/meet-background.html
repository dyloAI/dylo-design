<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dylo — video call backgrounds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Source for public/brand/dylo-meet-background-*.png.
         Also fine for Zoom and Teams — all three want 1920x1080.

         The two frames are stacked edge to edge at exactly 1920x1080 with no
         page chrome, so regenerating them is a viewport capture at that size
         with no scaling:

           agent-browser set viewport 1920 1080
           agent-browser open file://.../meet-background.html
           agent-browser screenshot dylo-meet-background-bone.png
           agent-browser eval "window.scrollTo(0, 1080)"
           agent-browser screenshot dylo-meet-background-ink.png

         Two constraints drive the layout, and both come from how the image is
         actually seen rather than from how it looks at full size:

         1. The lockup sits in the top-left. The person occupies the centre and
            the lower third, and Meet puts the participant name chip in the
            bottom-left of the tile, so that corner is the only reliably
            visible area.
         2. It is far larger than a page equivalent. A tile is commonly
            rendered around 480px wide, so this is seen at roughly quarter
            scale — a page-sized lockup would land at about 18px tall. */

      :root {
        --dylo-ink: #1b1714;
        --dylo-concrete: #8e857a;
        --dylo-bone: #ece6d8;
        --dylo-grid-line: rgb(27 23 20 / 0.05);
        --dylo-grid-line-reversed: rgb(236 230 216 / 0.05);
        --dylo-tracking-eyebrow: 0.24em;
      }

      * {
        box-sizing: border-box;
      }

      html {
        /* Scrollbars would paint over the viewport and crop the capture. */
        scrollbar-width: none;
      }

      html::-webkit-scrollbar {
        display: none;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }

      .frame {
        width: 1920px;
        height: 1080px;
        /* One grid cell in from the corner. */
        padding: 96px;
        /* The engineering grid at 96px, two of the system's 48px cells. At
           quarter scale that reads the way 48px reads on a page; 48px here
           would collapse into moire. */
        background-size: 96px 96px;
      }

      .frame--bone {
        background-color: var(--dylo-bone);
        background-image:
          linear-gradient(var(--dylo-grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--dylo-grid-line) 1px, transparent 1px);
      }

      .frame--ink {
        background-color: var(--dylo-ink);
        background-image:
          linear-gradient(var(--dylo-grid-line-reversed) 1px, transparent 1px),
          linear-gradient(90deg, var(--dylo-grid-line-reversed) 1px, transparent 1px);
      }

      /* The lockup is the only thing placed on the frame. */
      .lockup {
        height: 150px;
        width: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame frame--bone">
      <svg class="lockup" viewBox="0 0 236.4 96" role="img" aria-label="dylo">
        <g transform="translate(-4.1,13) scale(1.25)">
          <path d="M10.5,18 L22.5,12.6 L27,48 L15.5,43.5 Z" fill="#1B1714"></path>
          <path d="M53.5,18 L41.5,12.6 L37,48 L48.5,43.5 Z" fill="#1B1714"></path>
          <path d="M24,12 L40,12 L35.5,48 L28.5,48 Z" fill="#9A5236"></path>
        </g>
        <text
          x="83.6"
          y="72"
          font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif"
          font-weight="700"
          font-size="74"
          letter-spacing="-3.5"
          fill="#1B1714"
        >
          dylo
        </text>
      </svg>
    </div>

    <div class="frame frame--ink">
      <svg class="lockup" viewBox="0 0 236.4 96" role="img" aria-label="dylo">
        <g transform="translate(-4.1,13) scale(1.25)">
          <path d="M10.5,18 L22.5,12.6 L27,48 L15.5,43.5 Z" fill="#ECE6D8"></path>
          <path d="M53.5,18 L41.5,12.6 L37,48 L48.5,43.5 Z" fill="#ECE6D8"></path>
          <path d="M24,12 L40,12 L35.5,48 L28.5,48 Z" fill="#9A5236"></path>
        </g>
        <text
          x="83.6"
          y="72"
          font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif"
          font-weight="700"
          font-size="74"
          letter-spacing="-3.5"
          fill="#ECE6D8"
        >
          dylo
        </text>
      </svg>
    </div>
  </body>
</html>
