<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dylo — video call backgrounds</title>
    <link rel="stylesheet" href="../registry/dylo/theme/dylo-tokens.css" />
    <style>
      /* Source for public/brand/dylo-meet-background-*.png.
         Also fine for Zoom and Teams — all three want 1920x1080.

         The two frames are stacked edge to edge at exactly 1920x1080 with no
         page chrome, so regenerating them is a viewport capture at that size
         with no scaling. Adding ?mirror flips both, which is where the
         -mirrored pair comes from — same frames, so the two can never drift:

           agent-browser set viewport 1920 1080
           agent-browser open file://.../meet-background.html
           agent-browser screenshot dylo-meet-background-light.png
           agent-browser eval "window.scrollTo(0, 1080)"
           agent-browser screenshot dylo-meet-background-dark.png
           agent-browser open "file://.../meet-background.html?mirror"
           agent-browser screenshot dylo-meet-background-light-mirrored.png
           agent-browser eval "window.scrollTo(0, 1080)"
           agent-browser screenshot dylo-meet-background-dark-mirrored.png

         The unmirrored pair is the default and the one that is correct for the
         people on the call: Meet composites the background into the outgoing
         stream and then mirrors only your self-view, so a wordmark that reads
         backwards to you reads correctly to everyone else. The -mirrored pair
         is for the setups that flip the outgoing stream too — some virtual
         cameras, and Zoom with "Mirror my video" left on.

         Two constraints drive the layout, and both come from how the image is
         actually seen rather than from how it looks at full size:

         1. The lockup sits in the top-left. The person occupies the centre and
            the lower third, and Meet puts the participant name chip in the
            bottom-left of the tile, so that corner is the only reliably
            visible area.
         2. It is far larger than a page equivalent. A tile is commonly
            rendered around 480px wide, so this is seen at roughly quarter
            scale — a page-sized lockup would land at about 18px tall. */

      * {
        box-sizing: border-box;
      }

      html {
        /* Scrollbars would paint over the viewport and crop the capture. */
        scrollbar-width: none;
      }

      html::-webkit-scrollbar {
        display: none;
      }

      body {
        margin: 0;
        padding: 0;
      }

      .frame {
        width: 1920px;
        height: 1080px;
        /* One grid cell in from the corner. */
        padding: 96px;
        /* The engineering grid at 96px, two of the system's 48px cells. At
           quarter scale that reads the way 48px reads on a page; 48px here
           would collapse into moire. */
        background-size: 96px 96px;
      }

      /* Each frame forces its theme with the token class, so the surface and
         the grid come from dylo-tokens.css and nothing is typed here. */
      .frame {
        background-color: var(--dylo-background);
        background-image:
          linear-gradient(var(--dylo-gray-2) 1px, transparent 1px),
          linear-gradient(90deg, var(--dylo-gray-2) 1px, transparent 1px);
      }

      /* ?mirror pre-flips the frame so it survives a stream that mirrors. */
      body.mirrored .frame {
        transform: scaleX(-1);
      }

      /* The lockup is the only thing placed on the frame. It is the shipped
         file, so the background can never drift from the logo. */
      .lockup {
        height: 140px;
        width: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame light">
      <img class="lockup" src="../public/brand/dylo-logo-horizontal.svg" alt="dylo" />
    </div>

    <div class="frame dark">
      <img class="lockup" src="../public/brand/dylo-logo-horizontal-reversed.svg" alt="dylo" />
    </div>

    <script>
      if (new URLSearchParams(location.search).has('mirror')) {
        document.body.classList.add('mirrored')
      }
    </script>
  </body>
</html>
